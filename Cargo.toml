[package]
name = "node-version-keeper"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Finds Node.js versions in project files under a folder and bumps them to the latest patch release"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"

[dev-dependencies]
tempfile = "3"
